<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ALAHLAM — نظام محاسبة وإدارة الفندق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220; --panel:#121B2C; --panel2:#17233A; --line:#223047;
  --text:#E7ECF3; --text-soft:#93A1B4; --text-faint:#5E6B80;
  --blue:#2F6FED; --blue-deep:#2456C4; --green:#22C55E; --green-tint:#123322;
  --red:#EF4444; --red-tint:#3A1A1D; --amber:#F0B429; --amber-tint:#332A10;
  --teal:#38BDF8; --shadow:0 10px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
.app{display:flex;min-height:100vh;}
.sidebar{width:230px;flex:0 0 230px;background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.brand img,.brand .logo-fallback{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;}
.logo-fallback{background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;}
.brand-name{font-weight:800;font-size:15.5px;}
.brand-sub{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
nav.navlist{padding:10px 8px;flex:1;}
.navlist button{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:none;color:var(--text-soft);padding:9px 11px;border-radius:7px;font-size:13.5px;font-weight:500;text-align:right;margin-bottom:2px;}
.navlist button svg{flex:none;width:17px;height:17px;opacity:.85;}
.navlist button:hover{background:rgba(255,255,255,.05);color:var(--text);}
.navlist button.active{background:var(--blue);color:#fff;}
.navlist .grp{font-size:10.5px;color:var(--text-faint);padding:12px 12px 4px;font-weight:700;}
.sidebar-foot{padding:10px 16px 16px;font-size:10.5px;color:var(--text-faint);}
.role-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--text-soft);padding:3px 9px;border-radius:20px;margin:0 16px 10px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
.topbar h1{font-size:17.5px;margin:0;font-weight:800;}
.topbar .date{font-size:12px;color:var(--text-faint);margin-top:2px;}
.topbar-search{margin-inline-start:auto;position:relative;width:230px;}
.topbar-search input{width:100%;padding:8px 32px 8px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12.5px;outline:none;}
.topbar-search svg{position:absolute;inset-inline-end:10px;top:8px;width:15px;height:15px;color:var(--text-faint);}
.content{padding:20px 24px 60px;flex:1;}
.grid{display:grid;gap:12px;}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);}
.stat-card{display:flex;align-items:flex-start;gap:10px;}
.stat-ic{width:34px;height:34px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--panel2);}
.stat-ic svg{width:17px;height:17px;}
.stat-label{font-size:11.5px;color:var(--text-soft);font-weight:500;}
.stat-value{font-size:21px;font-weight:800;margin-top:3px;}
.stat-hint{font-size:11px;color:var(--text-faint);margin-top:2px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px;}
.section-title{font-size:14.5px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;padding:8px 15px;border-radius:7px;font-size:13px;font-weight:700;}
.btn:hover{background:var(--blue-deep);}
.btn.green{background:var(--green);border-color:var(--green);color:#06210f;}
.btn.red{background:var(--red);border-color:var(--red);}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line);}
.btn.ghost:hover{background:var(--panel2);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:right;font-size:11px;color:var(--text-faint);font-weight:700;padding:8px 9px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
td{padding:9px 9px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--panel2);}
.tblwrap{overflow-x:auto;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.badge.ok{background:var(--green-tint);color:var(--green);}
.badge.warn{background:var(--amber-tint);color:var(--amber);}
.badge.bad{background:var(--red-tint);color:var(--red);}
.badge.info{background:rgba(56,189,248,.12);color:var(--teal);}
.badge.blue{background:rgba(47,111,237,.15);color:var(--teal);}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--text-soft);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;}
.filters button.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px;}
.room-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);cursor:pointer;}
.room-visual{height:74px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,var(--panel2),var(--bg));background-size:cover;background-position:center;}
.room-visual svg{width:30px;height:30px;color:var(--blue);opacity:.6;}
.room-visual .room-no{position:absolute;top:7px;inset-inline-start:9px;font-weight:800;font-size:14px;background:rgba(11,18,32,.65);padding:1px 8px;border-radius:6px;}
.room-body{padding:9px 11px 11px;}
.room-type{font-size:11.5px;color:var(--text-soft);}
.room-price{font-size:12px;font-weight:700;margin-top:2px;}
.room-status-row{margin-top:7px;}
.empty{text-align:center;padding:36px 10px;color:var(--text-faint);font-size:13px;}
.empty svg{width:30px;height:30px;margin-bottom:8px;opacity:.5;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:5vh 14px;z-index:50;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--panel);width:100%;max-width:460px;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:15px;font-weight:800;}
.modal-close{background:none;border:none;font-size:19px;color:var(--text-faint);line-height:1;}
.modal-body{padding:16px 18px;max-height:64vh;overflow-y:auto;}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;outline:none;background:var(--panel2);color:var(--text);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.field-inline{display:flex;gap:6px;}
.field-inline input{flex:1;}
.hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
.error-msg{font-size:11.5px;color:var(--red);margin-top:6px;display:none;}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:7px;align-items:center;}
.toast{background:var(--panel2);border:1px solid var(--line);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.4);}
.kv-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--text-soft);}
.kv-row .v{font-weight:700;}
.search-results section{margin-bottom:16px;}
.search-results h4{font-size:12px;color:var(--text-soft);margin:0 0 7px;}
.result-row{display:flex;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-size:13px;background:var(--panel2);}
.result-row .tag{font-size:10.5px;color:var(--text-faint);}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
@media (max-width:980px){.two-col{grid-template-columns:1fr;}}
.bars{display:flex;align-items:flex-end;gap:9px;height:100px;padding-top:10px;overflow-x:auto;}
.bar{flex:0 0 30px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.bar .stem{width:100%;border-radius:4px 4px 0 0;min-height:3px;}
.bar .lbl{font-size:9.5px;color:var(--text-faint);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.chip{font-size:11px;background:var(--panel2);border:1px solid var(--line);padding:4px 10px;border-radius:20px;color:var(--text-soft);}
.photo-drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font-size:12px;color:var(--text-faint);cursor:pointer;}
.photo-preview{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-top:8px;}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:7px;padding:6px;color:var(--text);}
.menu-btn svg{width:17px;height:17px;}
.sidebar-scrim{display:none;}
@media (max-width:880px){
  .sidebar{position:fixed;z-index:30;transform:translateX(100%);transition:transform .2s;width:230px;}
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:inline-flex !important;}
  .content{padding:14px;}
  .sidebar-scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25;}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-scrim" id="scrim" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brandBox"></div>
    <div class="role-pill" id="rolePill"></div>
    <nav class="navlist" id="navlist"></nav>
    <div class="sidebar-foot">ALAHLAM v1 — بياناتك محفوظة تلقائياً وخاصة بحسابك</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div><h1 id="pageTitle">لوحة التحكم</h1><div class="date" id="pageDate"></div></div>
      <div class="topbar-search">
        <input id="quickSearch" placeholder="بحث سريع…" oninput="onQuickSearch(this.value)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<script>
const STORAGE_KEY = "alahlam-hotel-state-clean-v1";
const SECTIONS = [
 {id:"dashboard",label:"لوحة التحكم"},
 {id:"rooms",label:"الغرف"},
 {id:"checkin",label:"تسكين / مغادرة"},
 {id:"guests",label:"النزلاء"},
 {id:"vouchers",label:"السندات (قبض/صرف)"},
 {id:"debts",label:"الديون والذمم"},
 {id:"rent",label:"إيجار الفندق"},
 {id:"staff",label:"الموظفون والرواتب"},
 {id:"search",label:"البحث السريع"},
 {id:"reports",label:"التقارير المالية"},
 {id:"settings",label:"الإعدادات والصلاحيات"},
];
const ICONS = {
 dashboard:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>`,
 rooms:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21V6a2 2 0 0 1 2-2h6v17"/><path d="M12 10h6a2 2 0 0 1 2 2v9"/><path d="M4 21h16"/></svg>`,
 checkin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg>`,
 guests:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>`,
 vouchers:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>`,
 debts:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M9.5 9.3c0-1.3 1.1-2.1 2.5-2.1s2.5.9 2.5 2c0 2.6-5 1.8-5 4.4 0 1.2 1.1 2.1 2.5 2.1s2.5-.8 2.5-2.1"/></svg>`,
 rent:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-7h6v7"/></svg>`,
 staff:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><path d="M2.7 20c.9-3.6 3.2-5.5 5.8-5.5s4.9 1.9 5.8 5.5"/><path d="M14.5 14.8c2.2.2 3.9 1.9 4.6 4.7"/></svg>`,
 search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,
 reports:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M2 20h20"/></svg>`,
 settings:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg>`,
 bed:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18v2M21 18v2M3 12V7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>`,
 bell:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>`,
 wa:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.9-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.7.7.7-2.6-.2-.3A8 8 0 1 1 12 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1s-.6.8-.8 1c-.1.1-.3.2-.5.1-1.4-.6-2.3-1.5-3.2-2.8-.1-.2-.1-.3.1-.5l.4-.5c.1-.2.2-.3.1-.5-.1-.2-.6-1.4-.8-1.9-.1-.4-.3-.3-.5-.3h-.4c-.2 0-.5.1-.7.4-.2.3-.9 1-.9 2.3s1 2.7 1.2 2.9c.2.2 1.9 2.9 4.6 3.9 2.2.8 2.2.6 2.6.6.4 0 1.3-.5 1.5-1s.2-.9.1-1c-.1-.1-.2-.2-.4-.3z"/></svg>`,
 sms:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v11H8l-4 4z"/></svg>`,
};
const ROOM_STATUS = { vacant:{label:"شاغرة",cls:"ok"}, occupied:{label:"مشغولة",cls:"info"}, reserved:{label:"محجوزة",cls:"blue"}, cleaning:{label:"تحت التنظيف",cls:"warn"}, maintenance:{label:"تحت الصيانة",cls:"bad"} };

let state=null, currentSection="dashboard", quickSearchTerm="";

function uid(p){return p+"_"+Math.random().toString(36).slice(2,9);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function daysAgoISO(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}
function fmtMoney(n){return (Math.round((n||0)*100)/100).toLocaleString('ar-SA')+" ر.س";}
function fmtDate(iso){ if(!iso) return "—"; return new Date(iso+"T00:00:00").toLocaleDateString('ar-SA-u-nu-latn',{day:'numeric',month:'short',year:'numeric'});}
function nightsBetween(a,b){const d1=new Date(a+"T00:00:00"),d2=new Date(b+"T00:00:00");return Math.max(Math.round((d2-d1)/86400000),1);}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function roomTypeLabel(t){return {single:"مفردة",double:"مزدوجة",suite:"جناح"}[t]||t;}
function isAdmin(){return state.settings.role==="admin";}
function waLink(phone,text){ const p=(phone||"").replace(/[^0-9]/g,""); return `https://wa.me/${p}?text=${encodeURIComponent(text)}`; }
function smsLink(phone,text){ return `sms:${phone||""}?body=${encodeURIComponent(text)}`; }
function toast(msg){ const wrap=document.getElementById('toastWrap'); const el=document.createElement('div'); el.className='toast'; el.textContent=msg; wrap.appendChild(el); setTimeout(()=>el.remove(),2600); }

async function saveState(){
  try{ const res=await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); if(!res) toast("تعذر حفظ البيانات"); }
  catch(e){ console.error(e); toast("تعذر حفظ البيانات"); }
}

function defaultState(){
  // نسخة نظيفة: نفس النظام والواجهات، بدون أي بيانات تجريبية أو معاملات سابقة.
  const roomDefs=[
   [101,1,"single","داخلي",150,90],[102,1,"single","داخلي",150,90],[103,1,"single","خارجي",130,80],
   [104,1,"single","داخلي",150,90],[105,1,"double","داخلي",220,130],[106,1,"double","داخلي",220,130],
   [107,1,"suite","داخلي",380,220],[201,2,"single","داخلي",150,90],[202,2,"single","داخلي",150,90],
   [203,2,"single","خارجي",130,80],[204,2,"single","داخلي",150,90],[205,2,"double","داخلي",220,130],
   [206,2,"double","داخلي",220,130],[207,2,"suite","داخلي",380,220],[301,3,"single","داخلي",150,90],
   [302,3,"single","داخلي",150,90],[303,3,"single","خارجي",130,80],[304,3,"single","داخلي",150,90],
   [305,3,"double","داخلي",220,130],[306,3,"double","داخلي",220,130],[307,3,"suite","داخلي",380,220]
  ];
  const rooms=roomDefs.map(([number,floor,type,bathroom,price,dayUsePrice])=>({
    id:uid("room"), number,floor,type,bathroom,price,dayUsePrice,status:"vacant",photo:null,history:[]
  }));
  return {
    hotelName:"فندق وأجنحة قصر الأحلام", logo:null,
    rooms,
    guests:[],
    debts:[],
    staff:[],
    vouchers:[],
    nextVoucherNo:1001,
    rent:{monthlyAmount:0,dueDay:1,payments:[]},
    settings:{ password:"admin123", role:"admin" }
  };
}

async function loadState(){
  try{ const res=await window.storage.get(STORAGE_KEY); if(res&&res.value){ state=JSON.parse(res.value); if(!state.rent) state.rent={monthlyAmount:0,dueDay:1,payments:[]}; if(!state.settings.role) state.settings.role="admin"; return; } }
  catch(e){}
  state=defaultState(); await saveState();
}

function roomById(id){return state.rooms.find(r=>r.id===id);}
function currentGuestForRoom(roomId){return state.guests.find(g=>g.roomId===roomId&&g.status==="current");}
function guestById(id){return state.guests.find(g=>g.id===id);}
function occupiedCount(){return state.rooms.filter(r=>r.status==="occupied").length;}
function vacantCount(){return state.rooms.filter(r=>r.status==="vacant").length;}
function totalReceipts(){return state.vouchers.filter(v=>v.kind==="receipt").reduce((s,v)=>s+v.amount,0);}
function totalPayments(){return state.vouchers.filter(v=>v.kind==="payment").reduce((s,v)=>s+v.amount,0);}
function totalDebts(){return state.debts.reduce((s,d)=>s+d.remaining,0);}
function todayReceipts(){return state.vouchers.filter(v=>v.kind==="receipt"&&v.date===todayISO()).reduce((s,v)=>s+v.amount,0);}
function todayPayments(){return state.vouchers.filter(v=>v.kind==="payment"&&v.date===todayISO()).reduce((s,v)=>s+v.amount,0);}
function roomLabelForGuest(g){ if(g.roomId){const r=roomById(g.roomId); return r?r.number:"—";} return g.roomNumberSnapshot||"—"; }
function rentArrears(){
  const d=new Date(); const dueThisMonth=new Date(d.getFullYear(),d.getMonth(),state.rent.dueDay);
  const paidThisMonth=state.rent.payments.some(p=> new Date(p.date).getMonth()===d.getMonth() && new Date(p.date).getFullYear()===d.getFullYear());
  const overdue = !paidThisMonth && d>dueThisMonth;
  return { overdue, dueDate: dueThisMonth.toISOString().slice(0,10), paidThisMonth };
}

function setRoomStatus(roomId,status,note){
  const r=roomById(roomId); r.status=status; r.history.push({date:todayISO(),status,note:note||""});

}
function uploadRoomPhoto(ev,roomId){
  const file=ev.target.files[0]; if(!file) return;
  const img=new Image(); const reader=new FileReader();
  reader.onload=e=>{
    img.onload=()=>{
      const canvas=document.createElement('canvas'); const maxW=480;
      const scale=Math.min(1,maxW/img.width);
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl=canvas.toDataURL('image/jpeg',.72);
      const r=roomById(roomId); r.photo=dataUrl; saveState();
      closeModal(); renderContent(); toast("تم حفظ صورة الغرفة");
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function openCheckinModal(preRoomId){
  const vacantRooms=state.rooms.filter(r=>r.status==="vacant").sort((a,b)=>a.number-b.number);
  if(!vacantRooms.length){ toast("لا توجد غرف شاغرة"); return; }
  const body=`

   <div class="field"><label>رقم الجوال</label>

   </div>

function updateCiPrice(){
  const room=roomById(document.getElementById('ci-room').value);
  const type=document.getElementById('ci-type').value;
  const price = type==="dayuse"?room.dayUsePrice:room.price;
  document.getElementById('ci-price-hint').textContent = `السعر: ${fmtMoney(price)}${type==="dayuse"?" (سعر ثابت للاستراحة)":" لليلة الواحدة"}`;
}
function submitCheckin(){
  const name=document.getElementById('ci-name').value.trim();
  const phone=document.getElementById('ci-phone').value.trim();
  const roomId=document.getElementById('ci-room').value;
  const stayType=document.getElementById('ci-type').value;
  const date=document.getElementById('ci-date').value||todayISO();
  const paid=parseFloat(document.getElementById('ci-paid').value)||0;
  const err=document.getElementById('ci-error');
  if(!name){ err.textContent="الرجاء إدخال اسم النزيل"; err.style.display="block"; return; }
  const room=roomById(roomId);
  const price = stayType==="dayuse"?room.dayUsePrice:room.price;
  const guest={id:uid("g"),name,phone,roomId,checkIn:date,checkOut:null,stayType,status:"current",price,paid};
  state.guests.push(guest);
  room.status="occupied"; room.history.push({date,status:"occupied",note:`تسكين ${name}`});
  if(paid>0) state.vouchers.push({id:uid("v"),no:state.nextVoucherNo++,kind:"receipt",category:"دفعة نزيل",amount:paid,date,party:name,phone,note:"دفعة عند التسكين"});
  saveState(); closeModal(); renderContent(); toast(`تم تسكين ${name} في غرفة ${room.number}`);
}
function openCheckoutModal(guestId){
  const g=guestById(guestId);
  const nights=g.stayType==="dayuse"?1:nightsBetween(g.checkIn,todayISO());
  const total=g.stayType==="dayuse"?g.price:nights*g.price;
  const remaining=Math.max(total-g.paid,0);
  const body=`
   <div class="kv-row"><div class="k">النزيل</div><div class="v">${escapeHtml(g.name)}</div></div>
   <div class="kv-row"><div class="k">الغرفة</div><div class="v">${roomLabelForGuest(g)}</div></div>
   <div class="kv-row"><div class="k">النوع</div><div class="v">${g.stayType==="dayuse"?"استراحة":nights+" ليالي"}</div></div>
   <div class="kv-row"><div class="k">الإجمالي</div><div class="v">${fmtMoney(total)}</div></div>
   <div class="kv-row"><div class="k">المدفوع مسبقاً</div><div class="v">${fmtMoney(g.paid)}</div></div>
   <div class="kv-row"><div class="k">المتبقي</div><div class="v" style="color:${remaining>0?'var(--red)':'var(--green)'}">${fmtMoney(remaining)}</div></div>
   <div class="field" style="margin-top:12px;"><label>مبلغ يدفعه الآن</label><input id="co-pay" type="number" min="0" max="${remaining}" value="${remaining}"></div>
   <div class="hint">اترك القيمة كاملة للتسديد الكامل، أو غيّرها لتسجيل دفعة جزئية وترحيل الباقي دَيناً.</div>`;
  openModal("تسجيل مغادرة", body, `<button class="btn" onclick="submitCheckout('${guestId}',${total})">تأكيد المغادرة وإصدار السند</button>`);
}
function submitCheckout(guestId,total){
  const g=guestById(guestId);
  const pay=Math.max(parseFloat(document.getElementById('co-pay').value)||0,0);
  const newPaid=g.paid+pay;
  if(pay>0) state.vouchers.push({id:uid("v"),no:state.nextVoucherNo++,kind:"receipt",category:"دفعة نزيل",amount:pay,date:todayISO(),party:g.name,phone:g.phone,note:"تسوية عند المغادرة"});
  g.paid=newPaid; g.checkOut=todayISO(); g.status="past";
  const room=roomById(g.roomId);
  if(room){ room.status="cleaning"; room.history.push({date:todayISO(),status:"cleaning",note:`مغادرة ${g.name}`}); g.roomNumberSnapshot=room.number; }
  g.roomId=null;
  const remaining=Math.max(total-newPaid,0);
  if(remaining>0) state.debts.push({id:uid("d"),name:g.name,phone:g.phone,type:"guest",total,remaining,date:todayISO(),note:"رصيد متبقٍ بعد المغادرة"});
  saveState(); closeModal(); renderContent();
  toast(remaining>0?`تمت المغادرة — رصيد متبقٍ ${fmtMoney(remaining)}`:"تمت المغادرة والتسديد الكامل");
}
function pickContact(inputId){
  if(navigator.contacts && navigator.contacts.select){
    navigator.contacts.select(['tel','name'],{multiple:false}).then(c=>{
      if(c&&c[0]&&c[0].tel&&c[0].tel[0]) document.getElementById(inputId).value=c[0].tel[0];
    }).catch(()=>toast("تم إلغاء اختيار جهة الاتصال"));
  } else {
    toast("متصفحك لا يدعم اختيار جهات الاتصال مباشرة — الرجاء إدخال الرقم يدوياً");
  }
}

function openDebtModal(){

   <div class="field-row"><div class="field"><label>إجمالي الدين</label><input id="db-total" type="number" min="0" value="0"></div><div class="field"><label>المدفوع سابقاً</label><input id="db-paid" type="number" min="0" value="0"></div></div>

function submitDebt(){
  const name=document.getElementById('db-name').value.trim();
  const phone=document.getElementById('db-phone').value.trim();
  const type=document.getElementById('db-type').value;
  const total=parseFloat(document.getElementById('db-total').value)||0;
  const paid=parseFloat(document.getElementById('db-paid').value)||0;
  const note=document.getElementById('db-note').value.trim();
  const err=document.getElementById('db-error');
  if(!name||total<=0){ err.textContent="الرجاء إدخال الاسم وإجمالي دين أكبر من صفر"; err.style.display="block"; return; }
  const remaining=Math.max(total-paid,0);
  if(remaining<=0){ toast("لا يوجد رصيد متبقٍ لتسجيله"); return; }
  state.debts.push({id:uid("d"),name,phone,type,total,remaining,date:todayISO(),note});
  saveState(); closeModal(); renderContent(); toast("تم تسجيل الدين");
}
function openSettleModal(debtId){
  const d=state.debts.find(x=>x.id===debtId);
  openModal("تسديد دين", `
   <div class="kv-row"><div class="k">الجهة</div><div class="v">${escapeHtml(d.name)}</div></div>
   <div class="kv-row"><div class="k">المتبقي حالياً</div><div class="v">${fmtMoney(d.remaining)}</div></div>
   <div class="field" style="margin-top:12px;"><label>مبلغ التسديد</label><input id="settle-amt" type="number" min="0" max="${d.remaining}" value="${d.remaining}"></div>
  `, `<button class="btn" onclick="submitSettle('${debtId}')">تأكيد التسديد</button>`);
}
function submitSettle(debtId){
  const d=state.debts.find(x=>x.id===debtId);
  const amt=Math.min(Math.max(parseFloat(document.getElementById('settle-amt').value)||0,0),d.remaining);
  d.remaining-=amt;
  if(amt>0) state.vouchers.push({id:uid("v"),no:state.nextVoucherNo++,kind:"receipt",category:"تسديد دين",amount:amt,date:todayISO(),party:d.name,phone:d.phone,note:""});
  if(d.remaining<=0){ state.debts=state.debts.filter(x=>x.id!==debtId); toast("تم تسديد الدين بالكامل"); } else toast("تم تسجيل الدفعة");
  saveState(); closeModal(); renderContent();
}

function renderSearch(){
  return `<div class="panel"><input id="search-input" placeholder="ابحث في الغرف، النزلاء، الموظفين، السندات، الديون…" value="${escapeHtml(quickSearchTerm)}" oninput="onQuickSearch(this.value)" style="width:100%;padding:11px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;outline:none;"></div>
   <div class="search-results" id="searchResultsWrap">${renderSearchResults(quickSearchTerm)}</div>`;
}
function renderSearchResults(term){
  const t=(term||"").trim().toLowerCase();
  if(!t) return emptyState("ابدأ الكتابة لعرض النتائج");
  const rooms=state.rooms.filter(r=>String(r.number).includes(t)||roomTypeLabel(r.type).includes(t));
  const guests=state.guests.filter(g=>g.name.toLowerCase().includes(t)||(g.phone||"").includes(t));
  const staff=state.staff.filter(s=>s.name.toLowerCase().includes(t)||s.role.toLowerCase().includes(t));
  const vouchers=state.vouchers.filter(v=>v.category.toLowerCase().includes(t)||(v.party||"").toLowerCase().includes(t)||String(v.no).includes(t));
  const debts=state.debts.filter(d=>d.name.toLowerCase().includes(t)||(d.phone||"").includes(t));
  const sections=[
   ["غرف",rooms.map(r=>`<div class="result-row"><span>غرفة ${r.number} — ${roomTypeLabel(r.type)}</span><span class="tag">${ROOM_STATUS[r.status].label}</span></div>`)],
   ["نزلاء",guests.map(g=>`<div class="result-row"><span>${escapeHtml(g.name)}</span><span class="tag">${g.status==='current'?'مقيم':'غادر'}</span></div>`)],
   ["موظفون",staff.map(s=>`<div class="result-row"><span>${escapeHtml(s.name)}</span><span class="tag">${escapeHtml(s.role)}</span></div>`)],
   ["سندات",vouchers.map(v=>`<div class="result-row"><span>#${v.no} — ${escapeHtml(v.category)}</span><span class="tag">${fmtMoney(v.amount)}</span></div>`)],
   ["ديون",debts.map(d=>`<div class="result-row"><span>${escapeHtml(d.name)}</span><span class="tag">${fmtMoney(d.remaining)}</span></div>`)],
  ].filter(([,rows])=>rows.length);
  if(!sections.length) return emptyState("لا توجد نتائج مطابقة");
  return sections.map(([l,rows])=>`<section><h4>${l} (${rows.length})</h4>${rows.join("")}</section>`).join("");
}
function onQuickSearch(val){ quickSearchTerm=val; if(currentSection==="search"){ const w=document.getElementById('searchResultsWrap'); if(w) w.innerHTML=renderSearchResults(val); } }

     ${rows.map(r=>`<tr><td><span class="badge ${r.kind==='receipt'?'ok':'bad'}">${r.kind==='receipt'?'إيراد':'مصروف'}</span></td><td>${escapeHtml(r.cat)}</td><td>${fmtMoney(r.v)}</td></tr>`).join("")||`<tr><td colspan="3">لا توجد بيانات</td></tr>`}

    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="exportJSON()">تصدير نسخة احتياطية (JSON)</button>
      <button class="btn ghost" onclick="document.getElementById('import-file').click()">استيراد نسخة احتياطية</button>
      <button class="btn ghost" onclick="exportCSV()">تصدير CSV (السندات)</button>
    </div>
    <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importJSON(event)">
   </div>`;
}
function downloadBlob(content,filename,type){ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
function exportJSON(){ downloadBlob(JSON.stringify(state,null,2), `alahlam-backup-${todayISO()}.json`, "application/json"); toast("تم تصدير النسخة الاحتياطية"); }
function exportCSV(){
  const rows=[["رقم السند","النوع","البند","المبلغ","التاريخ","الجهة"]];
  state.vouchers.forEach(v=>rows.push([v.no,v.kind==='receipt'?'قبض':'صرف',v.category,v.amount,v.date,v.party||""]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  downloadBlob("\uFEFF"+csv, `vouchers-${todayISO()}.csv`, "text/csv;charset=utf-8;"); toast("تم التصدير");
}
function importJSON(ev){
  const file=ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{ const data=JSON.parse(e.target.result); if(!data.rooms||!data.vouchers) throw new Error("bad"); state=data; saveState(); renderBrand(); renderNav(); renderContent(); toast("تم استيراد النسخة الاحتياطية بنجاح"); }
    catch(err){ toast("ملف النسخة الاحتياطية غير صالح"); }
  };
  reader.readAsText(file);
}

/* ---------- settings ---------- */
function renderSettings(){
  return `
   <div class="panel" style="max-width:460px;"><div class="section-title">شعار الفندق واسمه</div>
    <div class="field"><label>اسم الفندق</label><input id="set-hotelname" value="${escapeHtml(state.hotelName)}"></div>
    <div class="photo-drop" onclick="document.getElementById('logo-input').click()">${state.logo?`<img src="${state.logo}" class="photo-preview" style="height:70px;object-fit:contain;">`:"اضغط لرفع شعار الفندق"}</div>
    <input type="file" id="logo-input" accept="image/*" style="display:none" onchange="uploadLogo(event)">
    <button class="btn sm" style="margin-top:10px;" onclick="saveHotelName()">حفظ الاسم</button>
   </div>
   <div class="panel" style="max-width:460px;"><div class="section-title">الصلاحيات</div>
    <div class="field"><label>الدور الحالي</label><select id="set-role" onchange="changeRole()"><option value="admin" ${isAdmin()?"selected":""}>مدير النظام (كل الصلاحيات)</option><option value="staff" ${!isAdmin()?"selected":""}>موظف استقبال (صلاحيات محدودة)</option></select></div>
    <p class="hint" style="margin:0;">وضع "موظف استقبال" يخفي أزرار حذف الموظفين، تعديل الرواتب، وإعادة تعيين البيانات.</p>
   </div>
   <div class="panel" style="max-width:460px;"><div class="section-title">تغيير كلمة المرور</div>
    <div class="field"><label>كلمة المرور الحالية</label><input id="pw-current" type="password"></div>
    <div class="field"><label>كلمة المرور الجديدة</label><input id="pw-new" type="password"></div>
    <div class="field"><label>تأكيد كلمة المرور الجديدة</label><input id="pw-confirm" type="password"></div>
    <div class="error-msg" id="pw-error"></div>
    <button class="btn" onclick="changePassword()">حفظ كلمة المرور</button>
   </div>
   ${isAdmin()?`<div class="panel" style="max-width:460px;"><div class="section-title">إعادة تعيين البيانات</div>
    <p class="hint" style="margin:0 0 12px;">حذف كل البيانات الحالية والعودة للبيانات الافتراضية — لا يمكن التراجع. يُفضّل تصدير نسخة احتياطية أولاً من التقارير.</p>
    <button class="btn red" onclick="resetData()">إعادة تعيين البيانات</button>
   </div>`:""}`;
}
function saveHotelName(){ state.hotelName=document.getElementById('set-hotelname').value.trim()||state.hotelName; saveState(); renderBrand(); toast("تم الحفظ"); }
function uploadLogo(ev){
  const file=ev.target.files[0]; if(!file) return;
  const img=new Image(); const reader=new FileReader();
  reader.onload=e=>{ img.onload=()=>{ const c=document.createElement('canvas'); const s=Math.min(1,120/img.width); c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); state.logo=c.toDataURL('image/png'); saveState(); renderBrand(); renderContent(); toast("تم حفظ الشعار"); }; img.src=e.target.result; };
  reader.readAsDataURL(file);
}
function changeRole(){ state.settings.role=document.getElementById('set-role').value; saveState(); renderBrand(); renderContent(); toast("تم تغيير الدور"); }
function changePassword(){
  const cur=document.getElementById('pw-current').value, nw=document.getElementById('pw-new').value, cf=document.getElementById('pw-confirm').value;
  const err=document.getElementById('pw-error'); err.style.display="none";
  if(cur!==state.settings.password){ err.textContent="كلمة المرور الحالية غير صحيحة"; err.style.display="block"; return; }
  if(nw.length<4){ err.textContent="كلمة المرور الجديدة يجب أن تكون 4 أحرف على الأقل"; err.style.display="block"; return; }
  if(nw!==cf){ err.textContent="كلمتا المرور غير متطابقتين"; err.style.display="block"; return; }
  state.settings.password=nw; saveState(); toast("تم تغيير كلمة المرور"); renderContent();
}
async function resetData(){
  if(!confirm("هل أنت متأكد من إعادة تعيين جميع البيانات؟")) return;
  state=defaultState(); await saveState(); renderBrand(); renderNav(); renderContent(); toast("تمت إعادة التعيين");
}

/* ---------- modal ---------- */
function openModal(title,bodyHtml,footHtml){
  document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">${bodyHtml}</div>${footHtml?`<div class="modal-foot">${footHtml}</div>`:""}`;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target.id==='modalOverlay') closeModal(); });

/* ---------- init / PWA manifest ---------- */
function setupManifest(){
  try{
    const manifest={ name:state.hotelName||"ALAHLAM", short_name:"ALAHLAM", start_url:".", display:"standalone", background_color:"#0B1220", theme_color:"#0B1220" };
    const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
    const link=document.createElement('link'); link.rel="manifest"; link.href=URL.createObjectURL(blob);
    document.head.appendChild(link);
  }catch(e){}
}
async function init(){
  document.getElementById('pageDate').textContent=new Date().toLocaleDateString('ar-SA-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  await loadState();
  renderBrand(); renderNav(); renderContent(); setupManifest();
}
init();
</script>
</body>
</html>

<style>

*{box-sizing:border-box;} html,body{margin:0;padding:0} body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;} button,input,select,textarea{font-family:inherit;} a{color:inherit;text-decoration:none;} table{width:100%;border-collapse:collapse;font-size:13px;} th{text-align:right;font-size:11px;color:var(--text-faint);font-weight:700;padding:8px 9px;border-bottom:1.5px solid var(--line);white-space:nowrap;} td{padding:9px 9px;border-bottom:1px solid var(--line);vertical-align:middle;} tbody tr:hover{background:rgba(255,255,255,.02);} .app{display:flex;min-height:100vh}.sidebar{width:240px;flex:0 0 240px;background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}.brand{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.brand img,.brand .logo-fallback{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none}.logo-fallback{background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px}.brand-name{font-weight:800;font-size:15px}.brand-sub{font-size:10.5px;color:var(--text-faint);margin-top:1px}.navlist{padding:10px 8px;flex:1}.navlist button{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:none;color:var(--text-soft);padding:9px 11px;border-radius:7px;font-size:13.5px;font-weight:500;text-align:right;margin-bottom:2px}.navlist button:hover{background:rgba(255,255,255,.05);color:var(--text)}.navlist button.active{background:var(--blue);color:#fff}.sidebar-foot{padding:10px 16px 16px;font-size:10.5px;color:var(--text-faint)}.role-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--text-soft);padding:3px 9px;border-radius:20px;margin:0 16px 10px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}.topbar h1{font-size:17.5px;margin:0;font-weight:800}.topbar .date{font-size:12px;color:var(--text-faint);margin-top:2px}.topbar-search{margin-inline-start:auto;position:relative;width:260px}.topbar-search input{width:100%;padding:8px 32px 8px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12.5px;outline:none}.topbar-search svg{position:absolute;inset-inline-end:10px;top:8px;width:15px;height:15px;color:var(--text-faint)}.content{padding:20px 24px 60px;flex:1}.grid{display:grid;gap:12px}.stat-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}.stat-card{display:flex;align-items:flex-start;gap:10px}.stat-ic{width:34px;height:34px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--panel2)}.stat-ic svg{width:17px;height:17px}.stat-label{font-size:11.5px;color:var(--text-soft);font-weight:500}.stat-value{font-size:21px;font-weight:800;margin-top:3px}.stat-hint{font-size:11px;color:var(--text-faint);margin-top:2px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}.section-title{font-size:14.5px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;padding:8px 15px;border-radius:7px;font-size:13px;font-weight:700}.btn:hover{background:var(--blue-deep)}.btn.green{background:var(--green);border-color:var(--green);color:#06210f}.btn.red{background:var(--red);border-color:var(--red)}.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}.btn.ghost:hover{background:var(--panel2)}.btn.sm{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}.badge.ok{background:var(--green-tint);color:var(--green)}.badge.warn{background:var(--amber-tint);color:var(--amber)}.badge.bad{background:var(--red-tint);color:var(--red)}.badge.info{background:rgba(56,189,248,.12);color:var(--teal)}.badge.blue{background:rgba(47,111,237,.15);color:var(--teal)}.badge.purple{background:rgba(139,92,246,.12);color:var(--purple)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.filters button{border:1px solid var(--line);background:var(--panel);color:var(--text-soft);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600}.filters button.active{background:var(--text);color:var(--bg);border-color:var(--text)}.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px}.room-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);cursor:pointer}.room-visual{height:74px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,var(--panel2),var(--bg));background-size:cover;background-position:center}.room-visual svg{width:30px;height:30px;color:var(--blue);opacity:.6}.room-visual .room-no{position:absolute;top:7px;inset-inline-start:9px;font-weight:800;font-size:14px;background:rgba(11,18,32,.65);padding:1px 8px;border-radius:6px}.room-body{padding:9px 11px 11px}.room-type{font-size:11.5px;color:var(--text-soft)}.room-price{font-size:12px;font-weight:700;margin-top:2px}.room-status-row{margin-top:7px}.empty{text-align:center;padding:36px 10px;color:var(--text-faint);font-size:13px}.empty svg{width:30px;height:30px;margin-bottom:8px;opacity: ts section{margin-bottom:16px}.search-results h4{font-size:12px;color:var(--text-soft);margin:0 0 7px}.result-row{display:flex;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-size:13px;background:var(--panel2)}.result-row .tag{font-size:10.5px;color:var(--text-faint)}.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}@media (max-width:980px){.two-col{grid-template-columns:1fr;}}.bars{display:flex;align-items:flex-end;gap:9px;height:100px;padding-top:10px;overflow-x:auto}.bar{flex:0 0 30px;display:flex;flex-direction:column;align-items:center;gap:5px}.bar .stem{width:100%;border-radius:4px 4px 0 0;min-height:3px}.bar .lbl{font-size:9.5px;color:var(--text-faint)}.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip{font-size:11px;background:var(--panel2);border:1px solid var(--line);padding:4px 10px;border-radius:20px;color:var(--text-soft)}.photo-drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font-size:12px;color:var(--text-faint);cursor:pointer}.photo-preview{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-top:8px}.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:7px;padding:6px;color:var(--text)}.menu-btn svg{width:17px;height:17px}.sidebar-scrim{display:none}@media (max-width:880px){.sidebar{position:fixed;z-index:30;transform:translateX(100%);transition:transform .2s;width:230px}.sidebar.open{transform:translateX(0)}.menu-btn{display:inline-flex !important}.content{padding:14px}.sidebar-scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}}

<body>
<div class="app">
  <div class="sidebar-scrim" id="scrim" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brandBox"></div>
    <div class="role-pill" id="rolePill"></div>
    <nav class="navlist" id="navlist"></nav>
    <div class="sidebar-foot">ALAHLAM v2 — بياناتك محلية وآمنة • مزامنة اختيارية عبر الإنترنت</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div><h1 id="pageTitle">لوحة التحكم</h1><div class="date" id="pageDate"></div></div>
      <div class="topbar-search">
        <input id="quickSearch" placeholder="بحث سريع…" oninput="onQuickSearch(this.value)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<script>

  {id:'checkin',label:'تسكين / مغادرة'},
  {id:'guests',label:'النزلاء'},
  {id:'accounts',label:'كشف الحساب'},
  {id:'vouchers',label:'السندات'},
  {id:'debts',label:'الديون'},
  {id:'utilities',label:'الكهرباء والمياه'},
  {id:'rent',label:'إيجار المبنى'},
  {id:'staff',label:'الموظفون'},
  {id:'search',label:'البحث'},
  {id:'reports',label:'التقارير'},
  {id:'settings',label:'الإعدادات'}

const ICONS = {
  dashboard:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>`,
  rooms:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21V6a2 2 0 0 1 2-2h6v17"/><path d="M12 10h6a2 2 0 0 1 2 2v9"/><path d="M4 21h16"/></svg>`,
  checkin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg>`,

  utilities:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M13 2l-5 9h4l-1 11 8-13h-4l2-7z"/></svg>`,

  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,
  reports:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M2 20h20"/></svg>`,
  settings:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg>`,
  accounts:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 18V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`,
  bed:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18v2M21 18v2M3 12V7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>`,
  bell:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>`,
  wa:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.9-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.7.7.7-2.6-.2-.3A8 8 0 1 1 12 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1s-.6.8-.8 1c-.1.1-.3.2-.5.1-1.4-.6-2.3-1.5-3.2-2.8-.1-.2-.1-.3.1-.5l.4-.5c.1-.2.2-.3.1-.5-.1-.2-.6-1.4-.8-1.9-.1-.4-.3-.3-.5-.3h-.4c-.2 0-.5.1-.7.4-.2.3-.9 1-.9 2.3s1 2.7 1.2 2.9c.2.2 1.9 2.9 4.6 3.9 2.2.8 2.2.6 2.6.6.4 0 1.3-.5 1.5-1s.2-.9.1-1c-.1-.1-.2-.2-.4-.3z"/></svg>`,
  sms:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v11H8l-4 4z"/></svg>`
};
const ROOM_STATUS = { vacant:{label:'شاغرة',cls:'ok'}, occupied:{label:'مشغولة',cls:'info'}, reserved:{label:'محجوزة',cls:'blue'}, cleaning:{label:'تحت التنظيف',cls:'warn'}, maintenance:{label:'تحت الصيانة',cls:'bad'} };
const ACCOUNT_TYPES = { customer:'عميل/زبون', supplier:'مورد', utility:'خدمات', rent:'إيجار', owner:'مالك', other:'أخرى' };
const UTILITY_TYPES = { electricity:'كهرباء', water:'مياه', gas:'غاز', internet:'إنترنت', cleaning:'تنظيف', maintenance:'صيانة' };
let state=null, currentSection='dashboard', quickSearchTerm='';
function uid(prefix){return prefix+'_'+Math.random().toString(36).slice(2,9);} 
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function formatMoney(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ar-SA')+' ر.س'; }
function formatDate(iso){ if(!iso) return '—'; return new Date(iso+'T00:00:00').toLocaleDateString('ar-SA-u-nu-latn',{day:'numeric',month:'short',year:'numeric'}); }
function formatDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('ar-SA-u-nu-latn',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function roomTypeLabel(t){ return {single:'مفردة', double:'مزدوجة', suite:'جناح', deluxe:'ديلوكس', family:'عائلة'}[t] || t; }
function isAdmin(){ return (state.settings && state.settings.role)==='admin'; }
function waLink(phone,text){ const p=(phone||'').replace(/[^0-9]/g,''); return `https://wa.me/${p}?text=${encodeURIComponent(text)}`; }
function smsLink(phone,text){ return `sms:${phone||''}?body=${encodeURIComponent(text)}`; }
function toast(msg){ const wrap=document.getElementById('toastWrap'); const el=document.createElement('div'); el.className='toast'; el.textContent=msg; wrap.appendChild(el); setTimeout(()=>el.remove(),2600); }

async function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (navigator.onLine && state.settings && state.settings.syncUrl) {
      try {
        await fetch(state.settings.syncUrl,{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type:'hotel-state', data: state, ts: nowISO()})});
      } catch (e) { console.warn('Sync skipped', e); }
    }
  } catch (err) { toast('تعذر حفظ البيانات'); }
}

function defaultRoomDefs(){
  return [
    [101,1,'single','داخلي',150,90], [102,1,'single','داخلي',150,90], [103,1,'single','خارجي',130,80], [104,1,'single','داخلي',150,90], [105,1,'double','داخلي',220,130], [106,1,'double','داخلي',220,130], [107,1,'suite','داخلي',380,220],
    [201,2,'single','داخلي',150,90], [202,2,'single','داخلي',150,90], [203,2,'single','خارجي',130,80], [204,2,'single','داخلي',150,90], [205,2,'double','داخلي',220,130], [206,2,'double','داخلي',220,130], [207,2,'suite','داخلي',380,220],
    [301,3,'single','داخلي',150,90], [302,3,'single','داخلي',150,90], [303,3,'single','خارجي',130,80], [304,3,'single','داخلي',150,90], [305,3,'double','داخلي',220,130], [306,3,'double','داخلي',220,130], [307,3,'suite','داخلي',380,220]
  ];
}

function defaultState(){
  const rooms=defaultRoomDefs().map(([number,floor,type,bathroom,price,dayUsePrice])=>({
    id:uid('room'), number, floor, type, bathroom, price, dayUsePrice, status:'vacant', photo:null, category:'standard', history:[], notes:''
  }));
  return {
    hotelName:'فندق وأجنحة قصر الأحلام', logo:null,
    rooms,
    guests:[],
    debts:[],
    staff:[],
    vouchers:[],
    ledger:[],
    accounts:[],
    utilities:[],
    nextVoucherNo:1001,
    nextLedgerNo:1,
    rent:{monthlyAmount:0,dueDay:1,payments:[]},

function ensureState(){
  try {
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw){ state=defaultState(); saveState(); return; }
    state=JSON.parse(raw);
    if(!state.settings){ state.settings={ password:'admin123', role:'admin', syncUrl:'', autoBackup:true, timezone:'Asia/Riyadh' }; }
    if(!state.rent){ state.rent={ monthlyAmount:0, dueDay:1, payments:[] }; }
    if(!state.accounts){ state.accounts=[]; }
    if(!state.utilities){ state.utilities=[]; }
    if(!state.ledger){ state.ledger=[]; }
    if(!state.meta){ state.meta={}; }
    state.meta.updatedAt=nowISO();

}

function openCheckoutModal(guestId){
  const g=guestById(guestId); const nights = g.stayType==='dayuse' ? 1 : nightsBetween(g.checkIn,todayISO()); const total = g.stayType==='dayuse' ? g.price : nights*g.price; const remaining = Math.max(total-g.paid,0); const body=`<div class="kv-row"><div class="k">النزيل</div><div class="v">${escapeHtml(g.name)}</div></div><div class="kv-row"><div class="k">الغرفة</div><div class="v">${roomLabelForGuest(g)}</div></div><div class="kv-row"><div class="k">النوع</div><div class="v">${g.stayType==='dayuse'?'استراحة':nights+' ليالي'}</div></div><div class="kv-row"><div class="k">الإجمالي</div><div class="v">${formatMoney(total)}</div></div><div class="kv-row"><div class="k">المدفوع مسبقاً</div><div class="v">${formatMoney(g.paid)}</div></div><div class="kv-row"><div class="k">المتبقي</div><div class="v" style="color:${remaining>0 ? 'var(--red)' : 'var(--green)'}">${formatMoney(remaining)}</div></div><div class="field" style="margin-top:12px;"><label>مبلغ يدفعه الآن</label><input id="co-pay" type="number" min="0" max="${remaining}" value="${remaining}"></div><div class="hint">اترك القيمة كاملة للتسديد الكامل، أو غيّرها لتسجيل دفعة جزئية وترحيل الباقي دَيناً.</div>`; openModal('تسجيل مغادرة', body, `<button class="btn" onclick="submitCheckout('${guestId}',${total})">تأكيد المغادرة وإصدار السند</button>`);
}
function submitCheckout(guestId,total){ const g=guestById(guestId); const pay = Math.max(Number(document.getElementById('co-pay').value) || 0, 0); const newPaid = g.paid + pay; if(pay>0){ state.vouchers.push({id:uid('v'),no:state.nextVoucherNo++,kind:'receipt',category:'دفعة نزيل',amount:pay,date:todayISO(),party:g.name,phone:g.phone,note:'تسوية عند المغادرة'}); }
  g.paid = newPaid; g.checkOut=todayISO(); g.status='past'; const room=roomById(g.roomId); if(room){ room.status='cleaning'; room.history.push({date:todayISO(),status:'cleaning',note:`مغادرة ${g.name}`}); g.roomNumberSnapshot=room.number; }
  g.roomId=null; const remaining = Math.max(total-newPaid,0); if(remaining>0){ state.debts.push({id:uid('d'),name:g.name,phone:g.phone,type:'guest',total,remaining,date:todayISO(),note:'رصيد متبقٍ بعد المغادرة'}); }
  state.ledger.push({id:uid('l'), ref:guestId, type:'income', amount:pay, date:todayISO(), accountName:g.name, category:'مغادرة', note:'تسوية حساب النزيل'});
  saveState(); closeModal(); renderContent(); toast(remaining>0 ? `تمت المغادرة — رصيد متبقٍ ${formatMoney(remaining)}` : 'تمت المغادرة والتسديد الكامل'); }
function pickContact(inputId){ if(navigator.contacts && navigator.contacts.select){ navigator.contacts.select(['tel','name'],{multiple:false}).then(c=>{ if(c && c[0] && c[0].tel && c[0].tel[0]) document.getElementById(inputId).value = c[0].tel[0]; }).catch(()=>toast('تم إلغاء اختيار جهة الاتصال')); } else { toast('متصفحك لا يدعم اختيار جهات الاتصال مباشرة — الرجاء إدخال الرقم يدوياً'); } }

function openAccountModal(){ const body=`<div class="field"><label>اسم الحساب</label><input id="acc-name"></div><div class="field"><label>النوع</label><select id="acc-type">${Object.entries(ACCOUNT_TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>رقم الجوال</label><div class="field-inline"><input id="acc-phone"><button class="btn ghost sm" onclick="pickContact('acc-phone')">جهات الاتصال</button></div></div><div class="field-row"><div class="field"><label>الرصيد الابتدائي</label><input id="acc-balance" type="number" value="0"></div><div class="field"><label>ملاحظات</label><input id="acc-note" placeholder="اختياري"></div></div><div class="error-msg" id="acc-error"></div>`; openModal('إضافة حساب جديد', body, `<button class="btn" onclick="submitAccount()">حفظ الحساب</button>`); }
function submitAccount(){ const name=document.getElementById('acc-name').value.trim(); const type=document.getElementById('acc-type').value; const phone=document.getElementById('acc-phone').value.trim(); const balance=Number(document.getElementById('acc-balance').value)||0; const note=document.getElementById('acc-note').value.trim(); const err=document.getElementById('acc-error'); if(!name){ err.textContent='الرجاء إدخال اسم الحساب'; err.style.display='block'; return; } state.accounts.push({id:uid('acc'), name, type, phone, balance, note, createdAt:todayISO()}); state.ledger.push({id:uid('l'), ref:'account', type: balance>=0 ? 'income':'expense', amount: Math.abs(balance), date:todayISO(), accountName:name, category:'رصيد افتتاحي', note:'رصيد أولي'}); saveState(); closeModal(); renderContent(); toast('تم حفظ الحساب'); }
function openAccountLedger(accountId){ const acc=accountById(accountId); const list=state.ledger.filter(x=>x.accountName===acc.name || x.ref===accountId).sort((a,b)=>b.date.localeCompare(a.date)); const body=`<div class="kv-row"><div class="k">الحساب</div><div class="v">${escapeHtml(acc.name)}</div></div><div class="kv-row"><div class="k">الرصيد الحالي</div><div class="v">${formatMoney(acc.balance)}</div></div><div style="margin-top:12px;"><div class="tblwrap"><table><thead><tr><th>التاريخ</th><th>البند</th><th>النوع</th><th>المبلغ</th></tr></thead><tbody>${list.length ? list.map(item=>`<tr><td>${formatDate(item.date)}</td><td>${escapeHtml(item.category || item.note || 'حركة')}</td><td>${item.type==='income' ? 'إيراد' : 'مصروف'}</td><td>${formatMoney(item.amount)}</td></tr>`).join('') : '<tr><td colspan="4">لا توجد حركات</td></tr>'}</tbody></table></div></div>`; openModal(`كشف حساب ${acc.name}`, body, `<button class="btn ghost" onclick="closeModal()">إغلاق</button>`); }

let voucherFilter='all';
function renderVouchers(){ const list=(state.vouchers||[]).filter(v=>voucherFilter==='all'||v.kind===voucherFilter).sort((a,b)=>b.no-a.no); return `<div class="grid stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));"><div class="card stat-card"><div><div class="stat-label">إجمالي المقبوضات</div><div class="stat-value" style="color:var(--green)">${formatMoney(totalReceipts())}</div></div></div><div class="card stat-card"><div><div class="stat-label">إجمالي المدفوعات</div><div class="stat-value" style="color:var(--red)">${formatMoney(totalPayments())}</div></div></div></div><div class="panel"><div class="section-title">السندات <span><button class="btn green sm" onclick="openVoucherModal('receipt')">+ سند قبض</button> <button class="btn red sm" onclick="openVoucherModal('payment')">+ سند صرف</button></span></div><div class="filters"><button class="${voucherFilter==='all' ? 'active':''}" onclick="setVoucherFilter('all')">جميع السندات (${state.vouchers.length})</button><button class="${voucherFilter==='receipt' ? 'active':''}" onclick="setVoucherFilter('receipt')">سندات القبض</button><button class="${voucherFilter==='payment' ? 'active':''}" onclick="setVoucherFilter('payment')">سندات الصرف</button></div><div class="tblwrap">${list.length ? `<table><thead><tr><th>رقم</th><th>النوع</th><th>التاريخ</th><th>الجهة</th><th>البند</th><th>المبلغ</th><th></th></tr></thead><tbody>${list.map(v=>`<tr><td>#${v.no}</td><td><span class="badge ${v.kind==='receipt'?'ok':'bad'}">${v.kind==='receipt'?'قبض':'صرف'}</span></td><td>${formatDate(v.date)}</td><td>${escapeHtml(v.party || '—')}</td><td>${escapeHtml(v.category)}</td><td>${formatMoney(v.amount)}</td><td style="display:flex;gap:5px;">${v.phone ? `<a class="btn ghost sm" href="${waLink(v.phone,'سند رقم #'+v.no+' — '+v.category+' بمبلغ '+formatMoney(v.amount))}" target="_blank">${ICONS.wa}</a><a class="btn ghost sm" href="${smsLink(v.phone,'سند رقم #'+v.no+' — '+v.category+' بمبلغ '+formatMoney(v.amount))}">${ICONS.sms}</a>` : ''}</td></tr>`).join('')}</tbody></table>` : emptyState('لا توجد سندات بعد')}</div></div>`; }
function setVoucherFilter(f){ voucherFilter=f; renderContent(); }
function openVoucherModal(kind){ const body=`<div class="field"><label>البند / التصنيف</label><input id="vc-cat" placeholder="${kind==='receipt' ? 'مثال: دفعة نزيل' : 'مثال: فاتورة كهرباء، مستلزمات، صيانة'}"></div><div class="field"><label>الجهة (المستلم / الدافع)</label><input id="vc-party" placeholder="اسم الجهة"></div><div class="field"><label>رقم جوال الجهة (اختياري)</label><div class="field-inline"><input id="vc-phone"><button class="btn ghost sm" onclick="pickContact('vc-phone')">جهات الاتصال</button></div></div><div class="field-row"><div class="field"><label>المبلغ</label><input id="vc-amt" type="number" min="0" value="0"></div><div class="field"><label>التاريخ</label><input id="vc-date" type="date" value="${todayISO()}"></div></div><div class="field"><label>بيان / ملاحظة</label><input id="vc-note" placeholder="اختياري"></div><div class="error-msg" id="vc-error"></div>`; openModal(kind==='receipt' ? 'سند قبض جديد' : 'سند صرف جديد', body, `<button class="btn" onclick="submitVoucher('${kind}')">حفظ السند</button>`); }
function submitVoucher(kind){ const category=document.getElementById('vc-cat').value.trim(); const party=document.getElementById('vc-party').value.trim(); const phone=document.getElementById('vc-phone').value.trim(); const amount=Number(document.getElementById('vc-amt').value)||0; const date=document.getElementById('vc-date').value||todayISO(); const note=document.getElementById('vc-note').value.trim(); const err=document.getElementById('vc-error'); if(!category || amount<=0){ err.textContent='الرجاء إدخال البند ومبلغ أكبر من صفر'; err.style.display='block'; return; } state.vouchers.push({id:uid('v'),no:state.nextVoucherNo++,kind,category,amount,date,party,phone,note}); state.ledger.push({id:uid('l'), ref:'voucher', type: kind==='receipt' ? 'income' : 'expense', amount, date, accountName:party || 'غير محدد', category, note}); saveState(); closeModal(); renderContent(); toast('تم حفظ السند'); }

function renderDebts(){ const list=[...state.debts].sort((a,b)=>b.remaining-a.remaining); return `<div class="panel"><div class="section-title">الديون والذمم <button class="btn sm" onclick="openDebtModal()">+ تسجيل دين قديم</button></div><div class="tblwrap">${list.length ? `<table><thead><tr><th>الاسم / الجهة</th><th>النوع</th><th>الهاتف</th><th>الإجمالي</th><th>المتبقي</th><th></th></tr></thead><tbody>${list.map(d=>`<tr><td>${escapeHtml(d.name)}</td><td>${d.type==='guest'?'نزيل':d.type==='supplier'?'مورّد':'أخرى'}</td><td>${escapeHtml(d.phone||'—')}</td><td>${formatMoney(d.total)}</td><td><span class="badge bad">${formatMoney(d.remaining)}</span></td><td style="display:flex;gap:5px;flex-wrap:wrap;"><button class="btn sm" onclick="openSettleModal('${d.id}')">تسديد</button>${d.phone ? `<a class="btn ghost sm" href="${waLink(d.phone,'تذكير: يوجد رصيد مستحق '+formatMoney(d.remaining)+' لدى '+state.hotelName)}" target="_blank">${ICONS.wa}</a>` : ''}</td></tr>`).join('')}</tbody></table>` : emptyState('لا توجد ديون مستحقة')}</div></div>`; }
function openDebtModal(){ const body=`<div class="field"><label>الاسم / الجهة</label><input id="db-name"></div><div class="field"><label>رقم الجوال</label><div class="field-inline"><input id="db-phone"><button class="btn ghost sm" onclick="pickContact('db-phone')">جهات الاتصال</button></div></div><div class="field"><label>النوع</label><select id="db-type"><option value="guest">نزيل</option><option value="supplier">مورّد</option><option value="other">أخرى</option></select></div><div class="field-row"><div class="field"><label>إجمالي الدين</label><input id="db-total" type="number" min="0" value="0"></div><div class="field"><label>المدفوع سابقاً</label><input id="db-paid" type="number" min="0" value="0"></div></div><div class="field"><label>ملاحظة</label><input id="db-note" placeholder="اختياري"></div><div class="error-msg" id="db-error"></div>`; openModal('تسجيل دين قديم', body, `<button class="btn" onclick="submitDebt()">حفظ</button>`); }
function submitDebt(){ const name=document.getElementById('db-name').value.trim(); const phone=document.getElementById('db-phone').value.trim(); const type=document.getElementById('db-type').value;const total=Number(document.getElementById('db-total').value)||0; const paid=Number(document.getElementById('db-paid').value)||0; const note=document.getElementById('db-note').value.trim(); const err=document.getElementById('db-error'); if(!name||total<=0){ err.textContent='الرجاء إدخال الاسم وإجمالي دين أكبر من صفر'; err.style.display='block'; return; } const remaining=Math.max(total-paid,0); if(remaining<=0){ toast('لا يوجد رصيد متبقٍ لتسجيله'); return; } state.debts.push({id:uid('d'),name,phone,type,total,remaining,date:todayISO(),note}); saveState(); closeModal(); renderContent(); toast('تم تسجيل الدين'); }
function openSettleModal(debtId){ const d=state.debts.find(x=>x.id===debtId); openModal('تسديد دين',`<div class="kv-row"><div class="k">الجهة</div><div class="v">${escapeHtml(d.name)}</div></div><div class="kv-row"><div class="k">المتبقي حالياً</div><div class="v">${formatMoney(d.remaining)}</div></div><div class="field" style="margin-top:12px;"><label>مبلغ التسديد</label><input id="settle-amt" type="number" min="0" max="${d.remaining}" value="${d.remaining}"></div>`, `<button class="btn" onclick="submitSettle('${debtId}')">تأكيد التسديد</button>`); }
function submitSettle(debtId){ const d=state.debts.find(x=>x.id===debtId); const amt=Math.min(Math.max(Number(document.getElementById('settle-amt').value)||0,0),d.remaining); d.remaining -= amt; if(amt>0){ state.vouchers.push({id:uid('v'),no:state.nextVoucherNo++,kind:'receipt',category:'تسديد دين',amount:amt,date:todayISO(),party:d.name,phone:d.phone,note:''}); state.ledger.push({id:uid('l'), ref:debtId, type:'income', amount:amt, date:todayISO(), accountName:d.name, category:'تسديد دين', note:'تسديد دين'}) } if(d.remaining<=0){ state.debts = state.debts.filter(x=>x.id!==debtId); toast('تم تسديد الدين بالكامل'); } else { toast('تم تسجيل الدفعة'); } saveState(); closeModal(); renderContent(); }

function openUtilityModal(){ const body=`<div class="field"><label>نوع الخدمة</label><select id="ut-type">${Object.entries(UTILITY_TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>الجهة / الاسم</label><input id="ut-name" placeholder="شركة الكهرباء / الشركة / الاسم"></div><div class="field-row"><div class="field"><label>المبلغ</label><input id="ut-amount" type="number" min="0" value="0"></div><div class="field"><label>التاريخ</label><input id="ut-date" type="date" value="${todayISO()}"></div></div><div class="field"><label>ملاحظة</label><input id="ut-note" placeholder="اختياري"></div><div class="error-msg" id="ut-error"></div>`; openModal('إضافة فاتورة خدمة', body, `<button class="btn" onclick="submitUtility()">حفظ الفاتورة</button>`); }
function submitUtility(){ const type=document.getElementById('ut-type').value; const name=document.getElementById('ut-name').value.trim() || (UTILITY_TYPES[type] || 'خدمة'); const amount=Number(document.getElementById('ut-amount').value)||0; const date=document.getElementById('ut-date').value||todayISO(); const note=document.getElementById('ut-note').value.trim(); const err=document.getElementById('ut-error'); if(amount<=0){ err.textContent='الرجاء إدخال مبلغ صحيح'; err.style.display='block'; return; } state.utilities.push({id:uid('ut'), type, name, amount, date, note}); state.vouchers.push({id:uid('v'), no:state.nextVoucherNo++, kind:'payment', category:`${UTILITY_TYPES[type] || type}`, amount, date, party:name, phone:'', note}); state.ledger.push({id:uid('l'), ref:'utility', type:'expense', amount, date, accountName:name, category:UTILITY_TYPES[type] || type, note:note || 'فاتورة خدمة'}); saveState(); closeModal(); renderContent(); toast('تم حفظ الفاتورة'); }

function renderRent(){ const ar=rentArrears(); return `<div class="grid stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));"><div class="card stat-card"><div><div class="stat-label">الإيجار الشهري</div><div class="stat-value">${formatMoney(state.rent.monthlyAmount)}</div></div></div><div class="card stat-card"><div><div class="stat-label">حالة هذا الشهر</div><div class="stat-value" style="font-size:16px;"><span class="badge ${ar.paidThisMonth?'ok':(ar.overdue?'bad':'warn')}">${ar.paidThisMonth?'مدفوع':(ar.overdue?'متأخر':'مستحق')}</span></div></div></div><div class="card stat-card"><div><div class="stat-label">تاريخ الاستحقاق</div><div class="stat-value" style="font-size:16px;">يوم ${state.rent.dueDay} من كل شهر</div></div></div></div><div class="panel"><div class="section-title">إعدادات الإيجار ${isAdmin()?`<button class="btn sm" onclick="openRentSettingsModal()">تعديل</button>':''}</div><p class="hint" style="margin:0;">القيمة الشهرية ويوم الاستحقاق يحسبان المتأخرات تلقائياً كل شهر.</p></div><div class="panel"><div class="section-title">سجل دفعات الإيجار <button class="btn sm" onclick="openRentPayModal()">+ تسجيل دفعة</button></div><div class="tblwrap">${state.rent.payments.length ? `<table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th></tr></thead><tbody>${[...state.rent.payments].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td>${formatDate(p.date)}</td><td>${formatMoney(p.amount)}</td><td>${escapeHtml(p.note||'—')}</td></tr>`).join('')}</tbody></table>` : emptyState('لا توجد دفعات مسجلة')}</div></div>`; }
function openRentSettingsModal(){ const body=`<div class="field"><label>المبلغ الشهري</label><input id="rt-amount" type="number" min="0" value="${state.rent.monthlyAmount}"></div><div class="field"><label>يوم الاستحقاق من الشهر</label><input id="rt-day" type="number" min="1" max="28" value="${state.rent.dueDay}"></div>`; openModal('إعدادات الإيجار الشهري', body, `<button class="btn" onclick="submitRentSettings()">حفظ</button>`); }
function submitRentSettings(){ state.rent.monthlyAmount = Number(document.getElementById('rt-amount').value) || 0; state.rent.dueDay = Math.min(Math.max(Number(document.getElementById('rt-day').value) || 1,1),28); saveState(); closeModal(); renderContent(); toast('تم حفظ إعدادات الإيجار'); }
function openRentPayModal(){ const body=`<div class="field"><label>المبلغ</label><input id="rp-amt" type="number" min="0" value="${state.rent.monthlyAmount}"></div><div class="field"><label>التاريخ</label><input id="rp-date" type="date" value="${todayISO()}"></div><div class="field"><label>ملاحظة</label><input id="rp-note" placeholder="اختياري"></div>`; openModal('تسجيل دفعة إيجار', body, `<button class="btn" onclick="submitRentPay()">حفظ</button>`); }
function submitRentPay(){ const amount=Number(document.getElementById('rp-amt').value)||0; const date=document.getElementById('rp-date').value||todayISO(); const note=document.getElementById('rp-note').value.trim(); if(amount<=0){ toast('الرجاء إدخال مبلغ صحيح'); return; } state.rent.payments.push({date,amount,note}); state.vouchers.push({id:uid('v'),no:state.nextVoucherNo++,kind:'payment',category:'إيجار المبنى',amount,date,party:'مالك المبنى',phone:'',note}); state.ledger.push({id:uid('l'), ref:'rent', type:'expense', amount, date, accountName:'مالك المبنى', category:'إيجار المبنى', note:note || 'دفعة إيجار'}); saveState(); closeModal(); renderContent(); toast('تم تسجيل دفعة الإيجار'); }

function renderStaff(){ const list=[...state.staff].sort((a,b)=>a.name.localeCompare(b.name,'ar')); const totalSalaries=list.filter(s=>s.active).reduce((s,x)=>s+x.salary,0); return `<div class="grid stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));"><div class="card stat-card"><div><div class="stat-label">إجمالي الرواتب الشهرية</div><div class="stat-value">${formatMoney(totalSalaries)}</div></div></div><div class="card stat-card"><div><div class="stat-label">عدد الموظفين</div><div class="stat-value">${list.length}</div></div></div></div><div class="panel"><div class="section-title">الموظفون ${isAdmin()?`<button class="btn sm" onclick="openStaffModal()">+ إضافة موظف</button>':''}</div><div class="tblwrap">${list.length ? `<table><thead><tr><th>الاسم</th><th>الوظيفة</th><th>القسم</th><th>الهاتف</th><th>الراتب</th><th>الحالة</th>${isAdmin()?'<th></th>':''}</tr></thead><tbody>${list.map(s=>`<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.role)}</td><td>${escapeHtml(s.dept||'—')}</td><td>${escapeHtml(s.phone||'—')}</td><td>${formatMoney(s.salary)}</td><td><span class="badge ${s.active?'ok':'bad'}">${s.active?'نشط':'غير نشط'}</span></td>${isAdmin()?`<td style="display:flex;gap:6px;"><button class="btn ghost sm" onclick="openStaffModal('${s.id}')">تعديل</button><button class="btn red sm" onclick="removeStaff('${s.id}')">حذف</button></td>`:''}</tr>`).join('')}</tbody></table>` : emptyState('لا يوجد موظفون')}</div></div>`; }
function openStaffModal(staffId){ const s=staffId ? state.staff.find(x=>x.id===staffId) : null; const body=`<div class="field"><label>الاسم</label><input id="st-name" value="${s ? escapeHtml(s.name) : ''}"></div><div class="field-row"><div class="field"><label>الوظيفة</label><input id="st-role" value="${s ? escapeHtml(s.role) : ''}"></div><div class="field"><label>القسم</label><input id="st-dept" value="${s ? escapeHtml(s.dept || '') : ''}"></div></div><div class="field"><label>الجوال</label><div class="field-inline"><input id="st-phone" value="${s ? escapeHtml(s.phone || '') : ''}"><button class="btn ghost sm" onclick="pickContact('st-phone')">جهات الاتصال</button></div></div><div class="field-row"><div class="field"><label>الراتب الشهري</label><input id="st-salary" type="number" min="0" value="${s ? s.salary : ''}"></div><div class="field"><label>تاريخ التعيين</label><input id="st-hire" type="date" value="${s ? s.hireDate : todayISO()}"></div></div><div class="field"><label>الحالة</label><select id="st-active"><option value="1" ${!s || s.active ? 'selected' : ''}>نشط</option><option value="0" ${s && !s.active ? 'selected' : ''}>غير نشط</option></select></div><div class="error-msg" id="st-error"></div>`; openModal(s ? 'تعديل بيانات موظف' : 'إضافة موظف', body, `<button class="btn" onclick="submitStaff(${s ? `'${s.id}'` : 'null'})">${s ? 'حفظ التعديلات' : 'إضافة'}</button>`); }
function submitStaff(staffId){ const name=document.getElementById('st-name').value.trim(); const role=document.getElementById('st-role').value.trim(); const dept=document.getElementById('st-dept').value.trim(); const phone=document.getElementById('st-phone').value.trim(); const salary=Number(document.getElementById('st-salary').value)||0; const hireDate=document.getElementById('st-hire').value||todayISO(); const active=document.getElementById('st-active').value==='1'; const err=document.getElementById('st-error'); if(!name||!role){ err.textContent='الرجاء إدخال الاسم والوظيفة'; err.style.display='block'; return; } if(staffId){ Object.assign(state.staff.find(x=>x.id===staffId),{name,role,dept,phone,salary,hireDate,active}); toast('تم حفظ التعديلات'); } else { state.staff.push({id:uid('s'),name,role,dept,phone,salary,hireDate,active}); toast('تمت إضافة الموظف'); } saveState(); closeModal(); renderContent(); }
function removeStaff(staffId){ if(!confirm('هل تريد حذف هذا الموظف؟')) return; state.staff=state.staff.filter(x=>x.id!==staffId); saveState(); renderContent(); toast('تم الحذف'); }

function renderSearch(){ return `<div class="panel"><input id="search-input" placeholder="ابحث في الغرف، النزلاء، الموظفين، السندات، الديون، الخدمات…" value="${escapeHtml(quickSearchTerm)}" oninput="onQuickSearch(this.value)" style="width:100%;padding:11px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;outline:none;"></div><div class="search-results" id="searchResultsWrap">${renderSearchResults(quickSearchTerm)}</div>`; }
function renderSearchResults(term){ const t=(term || '').trim().toLowerCase(); if(!t) return emptyState('ابدأ الكتابة لعرض النتائج'); const rooms=state.rooms.filter(r=>String(r.number).includes(t) || roomTypeLabel(r.type).includes(t) || (r.category||'').toLowerCase().includes(t)); const guests=state.guests.filter(g=>g.name.toLowerCase().includes(t) || (g.phone||'').includes(t)); const staff=state.staff.filter(s=>s.name.toLowerCase().includes(t) || s.role.toLowerCase().includes(t)); const vouchers=state.vouchers.filter(v=> (v.category||'').toLowerCase().includes(t) || (v.party||'').toLowerCase().includes(t) || String(v.no).includes(t)); const debts=state.debts.filter(d=>d.name.toLowerCase().includes(t) || (d.phone||'').includes(t)); const utilities=state.utilities.filter(u=> (UTILITY_TYPES[u.type] || u.type).toLowerCase().includes(t) || (u.name||'').toLowerCase().includes(t)); const sections=[['غرف',rooms.map(r=>`<div class="result-row"><span>غرفة ${r.number} — ${roomTypeLabel(r.type)}</span><span class="tag">${ROOM_STATUS[r.status].label}</span></div>`)],['نزلاء',guests.map(g=>`<div class="result-row"><span>${escapeHtml(g.name)}</span><span class="tag">${g.status==='current'?'مقيم':'غادر'}</span></div>`)],['موظفون',staff.map(s=>`<div class="result-row"><span>${escapeHtml(s.name)}</span><span class="tag">${escapeHtml(s.role)}</span></div>`)],['سندات',vouchers.map(v=>`<div class="result-row"><span>#${v.no} — ${escapeHtml(v.category)}</span><span class="tag">${formatMoney(v.amount)}</span></div>`)],['ديون',debts.map(d=>`<div class="result-row"><span>${escapeHtml(d.name)}</span><span class="tag">${formatMoney(d.remaining)}</span></div>`)],['خدمات',utilities.map(u=>`<div class="result-row"><span>${escapeHtml(u.name)}</span><span class="tag">${UTILITY_TYPES[u.type] || u.type}</span></div>`)]] .filter(([,rows])=>rows.length); if(!sections.length) return emptyState('لا توجد نتائج مطابقة'); return sections.map(([l,rows])=>`<section><h4>${l} (${rows.length})</h4>${rows.join('')}</section>`).join(''); }
function onQuickSearch(val){ quickSearchTerm=val; if(currentSection==='search'){ const w=document.getElementById('searchResultsWrap'); if(w) w.innerHTML=renderSearchResults(val); } }

function renderReports(){ const occ=occupiedCount(); const occRate=Math.round((occ/state.rooms.length)*100 || 0); const byCategory={}; state.vouchers.forEach(v=>{ const k=v.kind+':'+v.category; byCategory[k]=(byCategory[k]||0)+v.amount; }); const rows=Object.entries(byCategory).map(([k,v])=>{ const [kind,cat]=k.split(':'); return {kind,cat,v}; }).sort((a,b)=>b.v-a.v); return `<div class="grid stat-grid"><div class="card stat-card"><div><div class="stat-label">إجمالي الإيرادات</div><div class="stat-value" style="color:var(--green)">${formatMoney(totalReceipts())}</div></div></div><div class="card stat-card"><div><div class="stat-label">إجمالي المصروفات</div><div class="stat-value" style="color:var(--red)">${formatMoney(totalPayments())}</div></div></div><div class="card stat-card"><div><div class="stat-label">صافي الربح</div><div class="stat-value">${formatMoney(totalReceipts()-totalPayments())}</div></div></div><div class="card stat-card"><div><div class="stat-label">نسبة الإشغال</div><div class="stat-value">${occRate}%</div></div></div><div class="card stat-card"><div><div class="stat-label">ديون مستحقة</div><div class="stat-value" style="color:var(--red)">${formatMoney(totalDebts())}</div></div></div></div><div class="panel"><div class="section-title">قائمة الإيرادات والمصروفات حسب البند</div><div class="tblwrap"><table><thead><tr><th>النوع</th><th>البند</th><th>الإجمالي</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="badge ${r.kind==='receipt'?'ok':'bad'}">${r.kind==='receipt'?'إيراد':'مصروف'}</span></td><td>${escapeHtml(r.cat)}</td><td>${formatMoney(r.v)}</td></tr>`).join('') || '<tr><td colspan="3">لا توجد بيانات</td></tr>'}</tbody></table></div></div><div class="panel"><div class="section-title">النسخ الاحتياطي والتصدير</div><p class="hint" style="margin:0 0 10px;">تصدير كامل بيانات النظام بصيغة JSON لأخذ نسخة احتياطية، أو استيراد نسخة سابقة. ويمكن كذلك إعداد رابط مزامنة إذا رغبت في النسخ عبر الإنترنت.</p><div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" onclick="exportJSON()">تصدير نسخة احتياطية (JSON)</button><button class="btn ghost" onclick="document.getElementById('import-file').click()">استيراد نسخة احتياطية</button><button class="btn ghost" onclick="exportCSV()">تصدير CSV (السندات)</button></div><input type="file" id="import-file" accept="application/json" style="display:none" onchange="importJSON(event)"></div>`; }
function downloadBlob(content,filename,type){ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
function exportJSON(){ downloadBlob(JSON.stringify(state,null,2), `alahlam-backup-${todayISO()}.json`, 'application/json'); toast('تم تصدير النسخة الاحتياطية'); }
function exportCSV(){ const rows=[['رقم السند','النوع','البند','المبلغ','التاريخ','الجهة']]; state.vouchers.forEach(v=>rows.push([v.no, v.kind==='receipt'?'قبض':'صرف', v.category, v.amount, v.date, v.party || ''])); const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'); downloadBlob('\uFEFF'+csv, `vouchers-${todayISO()}.csv`, 'text/csv;charset=utf-8;'); toast('تم التصدير'); }
function importJSON(ev){ const file=ev.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ try { const data=JSON.parse(e.target.result); if(!data.rooms || !data.vouchers) throw new Error('bad'); state=data; saveState(); renderBrand(); renderNav(); renderContent(); toast('تم استيراد النسخة الاحتياطية بنجاح'); } catch (err) { toast('ملف النسخة الاحتياطية غير صالح'); } }; reader.readAsText(file); }

function renderSettings(){ return `<div class="panel" style="max-width:460px;"><div class="section-title">شعار الفندق واسمه</div><div class="field"><label>اسم الفندق</label><input id="set-hotelname" value="${escapeHtml(state.hotelName)}"></div><div class="photo-drop" onclick="document.getElementById('logo-input').click()">${state.logo ? `<img src="${state.logo}" class="photo-preview" style="height:70px;object-fit:contain;">` : 'اضغط لرفع شعار الفندق'}</div><input type="file" id="logo-input" accept="image/*" style="display:none" onchange="uploadLogo(event)"><button class="btn sm" style="margin-top:10px;" onclick="saveHotelName()">حفظ الاسم</button></div><div class="panel" style="max-width:460px;"><div class="section-title">الصلاحيات</div><div class="field"><label>الدور الحالي</label><select id="set-role" onchange="changeRole()"><option value="admin" ${isAdmin() ? 'selected' : ''}>مدير الفندق (كل الصلاحيات)</option><option value="staff" ${!isAdmin()?'selected':''}>موظف استقبال (صلاحيات محدودة)</option></select></div><p class="hint" style="margin:0;">وضع "موظف استقبال" يخفي أزرار حذف الموظفين، تعديل الرواتب، وإعادة تعيين البيانات.</p></div><div class="panel" style="max-width:460px;"><div class="section-title">المزامنة عبر الإنترنت</div><div class="field"><label>رابط مزامنة JSON (اختياري)</label><input id="set-sync" value="${escapeHtml(state.settings.syncUrl || '')}" placeholder="https://example.com/api/sync"></div><div class="field"><label>حفظ تلقائي ونسخ احتياطي</label><select id="set-autobackup"><option value="1" ${state.settings.autoBackup ? 'selected' : ''}>مفعل</option><option value="0" ${!state.settings.autoBackup ? 'selected' : ''}>غير مفعل</option></select></div><button class="btn" onclick="saveSyncSettings()">حفظ إعدادات المزامنة</button></div><div class="panel" style="max-width:460px;"><div class="section-title">تغيير كلمة المرور</div><div class="field"><label>كلمة المرور الحالية</label><input id="pw-current" type="password"></div><div class="field"><label>كلمة المرور الجديدة</label><input id="pw-new" type="password"></div><div class="field"><label>تأكيد كلمة المرور الجديدة</label><input id="pw-confirm" type="password"></div><div class="error-msg" id="pw-error"></div><button class="btn" onclick="changePassword()">حفظ كلمة المرور</button></div>${isAdmin()?`<div class="panel" style="max-width:460px;"><div class="section-title">إعادة تعيين البيانات</div><p class="hint" style="margin:0 0 12px;">حذف كل البيانات الحالية والعودة للبيانات الافتراضية — لا يمكن التراجع. يُفضّل تصدير نسخة احتياطية أولاً.</p><button class="btn red" onclick="resetData()">إعادة تعيين البيانات</button></div>`:''}`; }
function saveHotelName(){ state.hotelName=document.getElementById('set-hotelname').value.trim() || state.hotelName; saveState(); renderBrand(); toast('تم الحفظ'); }
function uploadLogo(ev){ const file=ev.target.files[0]; if(!file) return; const img=new Image(); const reader=new FileReader(); reader.onload=e=>{ img.onload=()=>{ const c=document.createElement('canvas'); const s=Math.min(1,140/img.width); c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); state.logo=c.toDataURL('image/png'); saveState(); renderBrand(); renderContent(); toast('تم حفظ الشعار'); }; img.src=e.target.result; }; reader.readAsDataURL(file); }
function changeRole(){ state.settings.role=document.getElementById('set-role').value; saveState(); renderBrand(); renderContent(); toast('تم تغيير الدور'); }
function saveSyncSettings(){ state.settings.syncUrl=document.getElementById('set-sync').value.trim(); state.settings.autoBackup=document.getElementById('set-autobackup').value==='1'; saveState(); renderContent(); toast('تم حفظ إعدادات المزامنة'); }
function changePassword(){ const cur=document.getElementById('pw-current').value, nw=document.getElementById('pw-new').value, cf=document.getElementById('pw-confirm').value; const err=document.getElementById('pw-error'); err.style.display='none'; if(cur !== state.settings.password){ err.textContent='كلمة المرور الحالية غير صحيحة'; err.style.display='block'; return; } if(nw.length < 4){ err.textContent='كلمة المرور الجديدة يجب أن تكون 4 أحرف على الأقل'; err.style.display='block'; return; } if(nw !== cf){ err.textContent='كلمتا المرور غير متطابقتين'; err.style.display='block'; return; } state.settings.password=nw; saveState(); toast('تم تغيير كلمة المرور'); renderContent(); }
async function resetData(){ if(!confirm('هل أنت متأكد من إعادة تعيين جميع البيانات؟')) return; state=defaultState(); await saveState(); renderBrand(); renderNav(); renderContent(); toast('تمت إعادة التعيين'); }

function openModal(title,bodyHtml,footHtml){ document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">${bodyHtml}</div>${footHtml ? `<div class="modal-foot">${footHtml}</div>` : ''}`; document.getElementById('modalOverlay').classList.add('open'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target.id==='modalOverlay') closeModal(); });

function setupManifest(){ try { const manifest={ name: state.hotelName || 'ALAHLAM', short_name:'ALAHLAM', start_url:'.', display:'standalone', background_color:'#0B1220', theme_color:'#0B1220' }; const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'}); const link=document.createElement('link'); link.rel='manifest'; link.href=URL.createObjectURL(blob); document.head.appendChild(link); } catch(e){} }

async function init(){
  document.getElementById('pageDate').textContent = new Date().toLocaleDateString('ar-SA-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  ensureState(); renderBrand(); renderNav(); renderContent(); setupManifest();
}
init();
</script>
</body>
</html>
